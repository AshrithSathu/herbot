[package]
name = "herbot-core"
version = "0.1.0"
edition = "2024"

[dependencies]
croner = "3"
chrono-tz = "0.10"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
toml = "0.8"
mime_guess = "2"
chrono = { version = "0.4.45", features = ["serde"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "chrono"] }
teloxide = { version = "0.17.0", default-features = false, features = ["rustls"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
